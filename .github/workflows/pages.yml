name: Publish birthday map

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download and verify static website
        env:
          BUILD_URL: https://github.com/${{ github.repository }}/releases/download/atlas-build-v2/atlas-site-v2.zip
        run: |
          curl --fail --location --silent --show-error --retry 3 --output site.zip "$BUILD_URL"
          sha256sum --check <<< '504d576f4e5b4227aec4fe5d04f558fe4f95fb532d46bb4f74f134a8fd3a1af2  site.zip'
          unzip -q site.zip -d site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish

name: Publish birthday map

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Download and verify static website
        env:
          BUILD_URL: https://github.com/${{ github.repository }}/releases/download/atlas-build-v1/atlas-site.zip
        run: |
          curl --fail --location --silent --show-error --retry 3 --output site.zip "$BUILD_URL"
          sha256sum --check <<< '50005b763ff3f9e9b402a5a3f28d4ffa0a3a11659f0f93c5e120241e9e696b37  site.zip'
          unzip -q site.zip -d site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - uses: actions/deploy-pages@v4
        id: publish
